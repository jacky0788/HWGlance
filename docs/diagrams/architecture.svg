<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 360" width="830" height="360" font-family="'Microsoft JhengHei UI','Segoe UI',sans-serif">
  <title>HWGlance 架構：硬體 → 存取層 → 本體 → 視窗</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="830" height="360" rx="12" fill="#ffffff"/>

  <text x="110" y="38" text-anchor="middle" font-size="13" fill="#5F5E5A">硬體</text>
  <text x="325" y="38" text-anchor="middle" font-size="13" fill="#5F5E5A">存取層</text>
  <text x="757" y="38" text-anchor="middle" font-size="13" fill="#5F5E5A">視窗</text>

  <rect x="20" y="60" width="180" height="52" rx="8" fill="#F1EFE8" stroke="#888780"/>
  <text x="110" y="81" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">CPU 暫存器</text>
  <text x="110" y="99" text-anchor="middle" font-size="12" fill="#5F5E5A">Ryzen 7 5800X・SMN</text>

  <rect x="20" y="130" width="180" height="52" rx="8" fill="#F1EFE8" stroke="#888780"/>
  <text x="110" y="151" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">主機板 Super I/O</text>
  <text x="110" y="169" text-anchor="middle" font-size="12" fill="#5F5E5A">NCT6798D：溫度、風扇</text>

  <rect x="20" y="200" width="180" height="52" rx="8" fill="#F1EFE8" stroke="#888780"/>
  <text x="110" y="221" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">顯示卡</text>
  <text x="110" y="239" text-anchor="middle" font-size="12" fill="#5F5E5A">RTX 5070 Ti：核心、顯存</text>

  <rect x="20" y="270" width="180" height="52" rx="8" fill="#F1EFE8" stroke="#888780"/>
  <text x="110" y="291" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">硬碟 SMART</text>
  <text x="110" y="309" text-anchor="middle" font-size="12" fill="#5F5E5A">NVMe・SATA，共 6 顆</text>

  <line x1="200" y1="86" x2="238" y2="86" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="200" y1="156" x2="238" y2="156" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="200" y1="226" x2="238" y2="226" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="200" y1="296" x2="238" y2="296" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="240" y="60" width="170" height="122" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="325" y="108" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">PawnIO 驅動</text>
  <text x="325" y="128" text-anchor="middle" font-size="12" fill="#0F6E56">有簽章的核心驅動</text>
  <text x="325" y="146" text-anchor="middle" font-size="12" fill="#0F6E56">只開放給系統管理員</text>

  <rect x="240" y="200" width="170" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="325" y="221" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">顯卡驅動 NVAPI</text>
  <text x="325" y="239" text-anchor="middle" font-size="12" fill="#0F6E56">不用系統管理員</text>

  <rect x="240" y="270" width="170" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="325" y="291" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">DeviceIoControl</text>
  <text x="325" y="309" text-anchor="middle" font-size="12" fill="#0F6E56">要系統管理員</text>

  <path d="M410 126H430M410 226H430M410 296H430M430 126V296" fill="none" stroke="#5F5E5A" stroke-width="1.4"/>
  <line x1="430" y1="126" x2="464" y2="126" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="450" y="50" width="220" height="290" rx="16" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="560" y="74" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">HWGlance 本體</text>
  <text x="560" y="92" text-anchor="middle" font-size="12" fill="#534AB7">以系統管理員執行</text>

  <rect x="466" y="104" width="188" height="44" rx="8" fill="#ffffff" stroke="#7F77DD"/>
  <text x="560" y="131" text-anchor="middle" font-size="14" fill="#3C3489">LHM（pythonnet）</text>
  <rect x="466" y="164" width="188" height="44" rx="8" fill="#ffffff" stroke="#7F77DD"/>
  <text x="560" y="191" text-anchor="middle" font-size="14" fill="#3C3489">整理＋溫度門檻</text>
  <rect x="466" y="224" width="188" height="44" rx="8" fill="#ffffff" stroke="#7F77DD"/>
  <text x="560" y="251" text-anchor="middle" font-size="14" fill="#3C3489">快照＋10 分鐘歷史</text>
  <rect x="466" y="284" width="188" height="44" rx="8" fill="#ffffff" stroke="#7F77DD"/>
  <text x="560" y="311" text-anchor="middle" font-size="14" fill="#3C3489">HTTP 127.0.0.1</text>
  <line x1="560" y1="148" x2="560" y2="162" stroke="#534AB7" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="560" y1="208" x2="560" y2="222" stroke="#534AB7" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="560" y1="268" x2="560" y2="282" stroke="#534AB7" stroke-width="1.4" marker-end="url(#arrow)"/>

  <line x1="654" y1="306" x2="698" y2="306" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="700" y="258" width="115" height="84" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
  <text x="757" y="280" text-anchor="middle" font-size="14" font-weight="600" fill="#0C447C">視窗程序</text>
  <text x="757" y="298" text-anchor="middle" font-size="12" fill="#185FA5">pywebview</text>
  <text x="757" y="314" text-anchor="middle" font-size="12" fill="#185FA5">WebView2</text>
  <text x="757" y="330" text-anchor="middle" font-size="12" fill="#185FA5">關掉就釋放</text>
</svg>
