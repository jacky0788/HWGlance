[build-system]
requires = ["setuptools>=77", "wheel"]          # 77 起才認得 license = "MIT" 這種寫法（PEP 639）
build-backend = "setuptools.build_meta"

[project]
name = "hwglance"
version = "0.1.0"
license = "MIT"
description = "輕量的硬體溫度監控：一眼看出所有硬體的溫度"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pythonnet>=3.2.1",   # 載入 LibreHardwareMonitorLib（.NET Framework 4.8）
]

[project.optional-dependencies]
# 桌面視窗（Windows 走 WebView2）＋系統匣圖示
app = ["pywebview>=6.2", "pystray>=0.19", "Pillow>=11"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
# 新版 Starlette 的 TestClient 對 httpx 的提醒，不影響測試結果
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
